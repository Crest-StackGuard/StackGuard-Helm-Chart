apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stackguard-valkey
  namespace: ${STACKGUARD_NAMESPACE}
  annotations:
    stackguard.io/scaling: "disabled"
    stackguard.io/replicas: "1"
spec:
  serviceName: stackguard-valkey
  # Always exactly one Valkey pod.
  replicas: 1
  selector:
    matchLabels:
      app: stackguard-valkey
  template:
    metadata:
      labels:
        app: stackguard-valkey
    spec:
      restartPolicy: Always
      containers:
        - name: valkey
          image: ${VALKEY_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec valkey-server --appendonly yes
              --user default off
              --user "$VALKEY_USER" on ">$VALKEY_PASSWORD" '~*' '&*' '+@all'
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: VALKEY_USER
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: VALKEY_USER
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: VALKEY_PASSWORD
          resources:
            requests:
              cpu: "${VALKEY_REQ_CPU}"
              memory: "${VALKEY_REQ_MEM}"
            limits:
              cpu: "${VALKEY_LIMIT_CPU}"
              memory: "${VALKEY_LIMIT_MEM}"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --user "$VALKEY_USER" -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --user "$VALKEY_USER" -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: valkey-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: valkey-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${STACKGUARD_STORAGE_CLASS}
        resources:
          requests:
            storage: ${VALKEY_STORAGE_SIZE}
