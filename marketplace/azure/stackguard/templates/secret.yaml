apiVersion: v1
kind: Secret
metadata:
  name: stackguard-secrets
  namespace: {{ include "stackguard.namespace" . }}
  labels:
    {{- include "stackguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  STACKGUARD_SECRET: {{ required "secrets.stackguardSecret is required (must be exactly 32 characters)" .Values.secrets.stackguardSecret | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgres.password is required" .Values.secrets.postgres.password | quote }}
  STACKGUARD_DATABASE_URL: {{ include "stackguard.databaseUrl" . | quote }}
