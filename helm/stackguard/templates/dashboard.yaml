{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackguard-dashboard
  namespace: {{ include "stackguard.namespace" . }}
  labels:
    {{- include "stackguard.labels" . | nindent 4 }}
    app: stackguard-dashboard
  annotations:
    stackguard.io/scaling: "disabled"
    stackguard.io/replicas: "1"
spec:
  # Monolithic: exactly one dashboard pod. Never scale out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stackguard-dashboard
  template:
    metadata:
      labels:
        app: stackguard-dashboard
        {{- include "stackguard.selectorLabels" . | nindent 8 }}
        {{- include "stackguard.billingLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "stackguard.image" (dict "ctx" $ "key" "dashboard") }}
          imagePullPolicy: {{ .Values.images.dashboard.pullPolicy }}
          ports:
            - containerPort: {{ .Values.dashboard.service.port }}
              name: http
          env:
            - name: STACKGUARD_API_URL
              valueFrom:
                configMapKeyRef:
                  name: stackguard-config
                  key: STACKGUARD_API_URL
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- include "stackguard.tcpProbes" (dict "port" .Values.dashboard.service.port) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: stackguard-dashboard
  namespace: {{ include "stackguard.namespace" . }}
  labels:
    {{- include "stackguard.labels" . | nindent 4 }}
    app: stackguard-dashboard
  {{- with .Values.dashboard.service.azureDnsLabel }}
  annotations:
    # AKS only: publishes <label>.<region>.cloudapp.azure.com for this LoadBalancer.
    service.beta.kubernetes.io/azure-dns-label-name: {{ . | quote }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    app: stackguard-dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: {{ .Values.dashboard.service.port }}
{{- end }}
