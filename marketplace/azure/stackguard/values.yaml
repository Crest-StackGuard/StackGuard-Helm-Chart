# Values for the Azure Marketplace (CNAB) distribution of Stackguard.
#
# Differences from the public chart:
#   - The AKS cluster extension owns the namespace, so it is never created here.
#   - Images are declared under global.azure.images so the marketplace packaging
#     tool can retag them to the Microsoft-owned ACR.
#   - Secrets are supplied by the cluster extension via configurationProtectedSettings.
#
# Bundled by default: Postgres + official Valkey (valkey/valkey).
# For managed Azure Database for PostgreSQL + Azure Cache for Redis (Redis-compatible),
# set postgres.enabled / valkey.enabled false and supply secrets.databaseUrl + secrets.redisUrl.

# Empty -> resources land in the extension's release namespace.
namespace: ""
createNamespace: false

nameOverride: ""
fullnameOverride: ""

global:
  # AKS built-in managed-csi storage class.
  storageClass: managed-csi
  imagePullSecrets: []
  # Set by the ARM template to the cluster's region; combined with azureDnsLabel.
  azureRegion: ""
  azure:
    images:
      dashboard:
        registry: public.ecr.aws
        image: stackguard-io/dashboard
        tag: "v1.1.1"
      server:
        registry: public.ecr.aws
        image: stackguard-io/server
        tag: "v1.1.1"
      # Postgres 16: earlier bundle releases shipped 16.4, and Postgres cannot
      # open data from another major version. Move to 17 only with a migration.
      postgres:
        registry: docker.io/library
        image: postgres
        tag: "16.16"
      # Official Valkey: https://hub.docker.com/r/valkey/valkey
      valkey:
        registry: docker.io
        image: valkey/valkey
        tag: "8.1.12"

urls:
  # Empty -> http://<azureDnsLabel>.<azureRegion>.cloudapp.azure.com:<port>.
  dashboard: ""
  api: ""

secrets:
  # Overridden per-install through configurationProtectedSettings. Must be exactly 32 characters.
  stackguardSecret: "0123456789abcdef0123456789abcdef"
  postgres:
    database: stackguard
    user: stackguard
    password: replace-with-strong-password
  valkey:
    user: stackguard
    password: replace-with-strong-password
  databaseUrl: ""
  redisUrl: ""

# Fallback block, unused while global.azure.images is populated.
images:
  dashboard:
    registry: public.ecr.aws
    repository: stackguard-io/dashboard
    tag: "v1.1.1"
    pullPolicy: IfNotPresent
  server:
    registry: public.ecr.aws
    repository: stackguard-io/server
    tag: "v1.1.1"
    pullPolicy: IfNotPresent
  postgres:
    registry: docker.io/library
    repository: postgres
    tag: "16.16"
    pullPolicy: IfNotPresent
  valkey:
    registry: docker.io
    repository: valkey/valkey
    tag: "8.1.12"
    pullPolicy: IfNotPresent

dashboard:
  enabled: true
  service:
    type: LoadBalancer
    port: 4000
    # AKS only: publishes <label>.<region>.cloudapp.azure.com for this LoadBalancer.
    azureDnsLabel: ""
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi

server:
  enabled: true
  service:
    type: LoadBalancer
    port: 8080
    # AKS only: publishes <label>.<region>.cloudapp.azure.com for this LoadBalancer.
    azureDnsLabel: ""
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi
    # Earlier bundle releases mounted the volume root at /scans; move that data
    # into scans/ on first start. Safe on new volumes; runs once per volume.
    migrateLegacyLayout: true

valkey:
  enabled: true
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    size: 2Gi

postgres:
  enabled: true
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

networkPolicy:
  enabled: true

vpa:
  enabled: false
  updateMode: "Off"
