apiVersion: v1
kind: Secret
metadata:
  name: stackguard-secrets
  namespace: {{ include "stackguard.namespace" . }}
  labels:
    {{- include "stackguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  STACKGUARD_SECRET: {{ required "secrets.stackguardSecret is required (must be exactly 32 characters)" (.Values.secrets.stackguardSecret | toString) | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgres.database | toString | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgres.user | toString | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgres.password is required" (.Values.secrets.postgres.password | toString) | quote }}
  VALKEY_USER: {{ .Values.secrets.valkey.user | toString | quote }}
  VALKEY_PASSWORD: {{ required "secrets.valkey.password is required" (.Values.secrets.valkey.password | toString) | quote }}
  STACKGUARD_DATABASE_URL: {{ include "stackguard.databaseUrl" . | quote }}
  STACKGUARD_REDIS_URL: {{ include "stackguard.redisUrl" . | quote }}
