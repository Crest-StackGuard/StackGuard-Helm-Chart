{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: stackguard-postgres
  namespace: {{ include "stackguard.namespace" . }}
  labels:
    {{- include "stackguard.labels" . | nindent 4 }}
    app: stackguard-postgres
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    app: stackguard-postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stackguard-postgres
  namespace: {{ include "stackguard.namespace" . }}
  labels:
    {{- include "stackguard.labels" . | nindent 4 }}
    app: stackguard-postgres
  annotations:
    stackguard.io/scaling: "disabled"
    stackguard.io/replicas: "1"
spec:
  serviceName: stackguard-postgres
  # Always exactly one Postgres pod.
  replicas: 1
  selector:
    matchLabels:
      app: stackguard-postgres
  template:
    metadata:
      labels:
        app: stackguard-postgres
        {{- include "stackguard.selectorLabels" . | nindent 8 }}
        {{- include "stackguard.billingLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Postgres cannot open a data directory written by another major version.
        # Fail fast with instructions instead of crash-looping the database.
        - name: version-check
          image: {{ include "stackguard.image" (dict "ctx" $ "key" "postgres") }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              f=/var/lib/postgresql/data/pgdata/PG_VERSION
              [ -f "$f" ] || exit 0
              have=$(cat "$f")
              want=$(postgres --version | sed -E 's/[^0-9]*([0-9]+).*/\1/')
              if [ "$have" != "$want" ]; then
                echo "ERROR: the data volume holds PostgreSQL $have data but the image is PostgreSQL $want."
                echo "Set the Postgres image tag back to a $have.x release, or dump and restore into $want."
                echo "See 'Upgrading' in the StackGuard Helm README."
                exit 1
              fi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: {{ include "stackguard.image" (dict "ctx" $ "key" "postgres") }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
              name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ required "global.storageClass is required" .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
