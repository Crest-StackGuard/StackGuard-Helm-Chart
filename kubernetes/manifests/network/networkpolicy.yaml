apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stackguard-network
  namespace: ${STACKGUARD_NAMESPACE}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound on all ports (client can tighten later).
    - {}
  egress:
    # Allow outbound to cluster services and public internet (client can tighten later).
    - {}
