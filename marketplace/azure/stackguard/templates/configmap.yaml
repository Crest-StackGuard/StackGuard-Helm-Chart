apiVersion: v1
kind: ConfigMap
metadata:
  name: stackguard-config
  namespace: {{ include "stackguard.namespace" . }}
  labels:
    {{- include "stackguard.labels" . | nindent 4 }}
data:
  STACKGUARD_DASHBOARD_URL: {{ include "stackguard.publicUrl" (dict "ctx" . "url" .Values.urls.dashboard "service" .Values.dashboard.service) | quote }}
  STACKGUARD_API_URL: {{ include "stackguard.publicUrl" (dict "ctx" . "url" .Values.urls.api "service" .Values.server.service) | quote }}
