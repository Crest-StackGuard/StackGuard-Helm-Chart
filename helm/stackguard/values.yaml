# Default values for the Stackguard Helm chart.
# Override secrets and storageClass at install time — do not commit real secrets.
# Cloud tenant (AWS account / Azure subscription / GCP project) is detected from
# instance metadata — do not set CSP or cloud id here.

namespace: stackguard
createNamespace: true

nameOverride: ""
fullnameOverride: ""

global:
  # Required on most clusters. Examples: managed-csi (AKS), gp3 (EKS), standard-rwo (GKE)
  storageClass: ""
  imagePullSecrets: []

urls:
  # Public address people open in the browser (API + UI share this URL on port 8080).
  # Update after the LoadBalancer IP is assigned, then upgrade the release.
  application: http://localhost:8080

secrets:
  # Must be EXACTLY 32 characters. Generate: openssl rand -hex 16
  stackguardSecret: "0123456789abcdef0123456789abcdef"
  postgres:
    database: stackguard
    user: stackguard
    password: replace-with-strong-password
  # Leave empty to auto-build from postgres settings above.
  databaseUrl: ""

images:
  application:
    registry: public.ecr.aws
    repository: stackguard-io/stackguard
    tag: latest
    pullPolicy: Always
  postgres:
    registry: ""
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

# Application: ALWAYS exactly 1 pod / 1 container. No replicas key. No HPA. No VPA.
# Horizontal scale is forbidden. Raise application.resources + node VM size only.
# Default pod sizing targets one node: 8 vCPU / 16 GiB (app 4+8Gi, postgres 2+4Gi).
# Cloud overlays (values-eks/aks/gke.yaml) pin nodeSelector stackguard.io/os=ubuntu.
#
# Azure Marketplace UI should only override:
#   application.resources.(requests|limits).(cpu|memory)  → App CPU / RAM
#   application.persistence.size                         → App disk
# (Offer B node VM size = AKS Terraform node_vm_size — not Helm.)
# See values.marketplace.yaml.example
application:
  enabled: true
  service:
    type: LoadBalancer
    port: 8080
  # Optional; cloud overlays set stackguard.io/os: ubuntu
  nodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 8Gi
  # Single PVC covering all server data dirs (Docker: scan-data, storage-scans,
  # report-pdfs, identity-models → /scans, /app/storage_scans, /app/report_pdfs,
  # /app/identity-resolver/models).
  persistence:
    size: 10Gi

# Postgres — chart defaults only; leave as-is unless you intentionally change DB sizing.
postgres:
  enabled: true
  service:
    type: ClusterIP
    port: 5432
  # Sized to fit app + postgres on one 8 vCPU / 16 GiB node (see Terraform defaults).
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

# Permissive by default so pods can reach cloud metadata (169.254.169.254 /
# metadata.google.internal). If you tighten egress, keep those destinations.
networkPolicy:
  enabled: true
