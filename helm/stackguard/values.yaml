# Default values for the Stackguard Helm chart (split server + dashboard).
namespace: stackguard
createNamespace: true

nameOverride: ""
fullnameOverride: ""

global:
  storageClass: ""
  imagePullSecrets: []

urls:
  dashboard: http://localhost:4000
  api: http://localhost:8080

secrets:
  stackguardSecret: "0123456789abcdef0123456789abcdef"
  postgres:
    database: stackguard
    user: stackguard
    password: replace-with-strong-password
  databaseUrl: ""

images:
  dashboard:
    registry: public.ecr.aws
    repository: stackguard-io/dashboard
    tag: latest
    pullPolicy: Always
  server:
    registry: public.ecr.aws
    repository: stackguard-io/server
    tag: latest
    pullPolicy: Always
  postgres:
    registry: ""
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

dashboard:
  enabled: true
  service:
    type: LoadBalancer
    port: 4000
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi

server:
  enabled: true
  service:
    type: LoadBalancer
    port: 8080
  nodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 10Gi

valkey:
  enabled: true
  image: valkey/valkey:8
  service:
    port: 6379
  auth:
    user: stackguard
    password: replace-with-strong-password
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    size: 2Gi

postgres:
  enabled: true
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

networkPolicy:
  enabled: true
