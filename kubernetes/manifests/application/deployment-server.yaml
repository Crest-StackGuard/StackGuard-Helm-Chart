apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackguard-server
  namespace: ${STACKGUARD_NAMESPACE}
  annotations:
    stackguard.io/scaling: "disabled"
    stackguard.io/replicas: "1"
spec:
  # Monolithic: exactly one server pod. Never scale out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stackguard-server
  template:
    metadata:
      labels:
        app: stackguard-server
    spec:
      restartPolicy: Always
      initContainers:
        # Older manifests mounted the volume root at /scans. Move that data into
        # scans/ once so it stays visible under the sub-path layout below.
        - name: data-layout
          image: ${SERVER_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              cd /data
              [ -e .stackguard-layout-v2 ] && exit 0
              mkdir -p scans storage-scans report-pdfs identity-models
              for f in * .[!.]* ..?*; do
                [ -e "$f" ] || continue
                case "$f" in
                  scans|storage-scans|report-pdfs|identity-models|lost+found|.stackguard-layout-v2) ;;
                  *) mv "$f" scans/ ;;
                esac
              done
              touch .stackguard-layout-v2
          volumeMounts:
            - name: server-data
              mountPath: /data
      containers:
        - name: server
          image: ${SERVER_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: STACKGUARD_SECRET
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: STACKGUARD_SECRET
            - name: STACKGUARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: STACKGUARD_DATABASE_URL
            - name: STACKGUARD_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stackguard-secrets
                  key: STACKGUARD_REDIS_URL
            - name: STACKGUARD_API_URL
              valueFrom:
                configMapKeyRef:
                  name: stackguard-config
                  key: STACKGUARD_API_URL
            - name: STACKGUARD_DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: stackguard-config
                  key: STACKGUARD_DASHBOARD_URL
          resources:
            requests:
              cpu: "${SERVER_REQ_CPU}"
              memory: "${SERVER_REQ_MEM}"
            limits:
              cpu: "${SERVER_LIMIT_CPU}"
              memory: "${SERVER_LIMIT_MEM}"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: server-data
              mountPath: /scans
              subPath: scans
            - name: server-data
              mountPath: /app/storage_scans
              subPath: storage-scans
            - name: server-data
              mountPath: /app/report_pdfs
              subPath: report-pdfs
            - name: server-data
              mountPath: /app/identity-resolver/models
              subPath: identity-models
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: server-data-pvc
