# Default values for the Stackguard Helm chart.
# Override secrets and storageClass at install time — do not commit real secrets.

namespace: stackguard
createNamespace: true

nameOverride: ""
fullnameOverride: ""

global:
  # Required on most clusters. Examples: managed-csi (AKS), gp3 (EKS), standard-rwo (GKE)
  storageClass: ""
  imagePullSecrets: []
  # AKS region (e.g. southeastasia). With <component>.service.azureDnsLabel set,
  # empty urls below resolve to http://<label>.<region>.cloudapp.azure.com:<port>.
  azureRegion: ""

urls:
  # Public URLs. Empty falls back to the Azure DNS name (see global.azureRegion),
  # else http://localhost:<port>. Set after LoadBalancer IPs are assigned, then upgrade.
  dashboard: ""
  api: ""
  # Required by the app images although the AI service was removed. Empty -> API URL.
  ai: ""

secrets:
  # Must be EXACTLY 32 characters. Generate: openssl rand -hex 16
  stackguardSecret: "0123456789abcdef0123456789abcdef"
  postgres:
    database: stackguard
    user: stackguard
    password: replace-with-strong-password
  # Leave empty to auto-build from postgres settings above.
  databaseUrl: ""

images:
  dashboard:
    registry: public.ecr.aws
    repository: stackguard-io/dashboard
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  server:
    registry: public.ecr.aws
    repository: stackguard-io/server
    tag: "v1.0.1"
    pullPolicy: IfNotPresent
  postgres:
    registry: ""
    repository: postgres
    tag: "16.4"
    pullPolicy: IfNotPresent

dashboard:
  enabled: true
  replicas: 1
  service:
    type: LoadBalancer
    port: 4000
    # AKS only: publishes <label>.<region>.cloudapp.azure.com for this LoadBalancer.
    azureDnsLabel: ""
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

server:
  enabled: true
  replicas: 1
  service:
    type: LoadBalancer
    port: 8080
    # AKS only: publishes <label>.<region>.cloudapp.azure.com for this LoadBalancer.
    azureDnsLabel: ""
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 10Gi

postgres:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

networkPolicy:
  enabled: true

vpa:
  enabled: false
  updateMode: Off
