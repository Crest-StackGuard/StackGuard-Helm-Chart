apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackguard-dashboard
  namespace: ${STACKGUARD_NAMESPACE}
  annotations:
    stackguard.io/scaling: "disabled"
    stackguard.io/replicas: "1"
spec:
  # Monolithic: exactly one dashboard pod. Never scale out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stackguard-dashboard
  template:
    metadata:
      labels:
        app: stackguard-dashboard
    spec:
      restartPolicy: Always
      containers:
        - name: dashboard
          image: ${DASHBOARD_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: STACKGUARD_API_URL
              valueFrom:
                configMapKeyRef:
                  name: stackguard-config
                  key: STACKGUARD_API_URL
          resources:
            requests:
              cpu: "${DASHBOARD_REQ_CPU}"
              memory: "${DASHBOARD_REQ_MEM}"
            limits:
              cpu: "${DASHBOARD_LIMIT_CPU}"
              memory: "${DASHBOARD_LIMIT_MEM}"
