# Default values for the Stackguard Helm chart.
# Override secrets and storageClass at install time — do not commit real secrets.

namespace: stackguard
createNamespace: true

nameOverride: ""
fullnameOverride: ""

global:
  # Required on most clusters. Examples: managed-csi (AKS), gp3 (EKS), standard-rwo (GKE)
  storageClass: ""
  imagePullSecrets: []

urls:
  # Update after LoadBalancer IPs are assigned, then upgrade the release.
  dashboard: http://localhost:4000
  api: http://localhost:8080
  ai: http://localhost:8000

secrets:
  # Must be EXACTLY 32 characters. Generate: openssl rand -hex 16
  stackguardSecret: "0123456789abcdef0123456789abcdef"
  postgres:
    database: stackguard
    user: stackguard
    password: replace-with-strong-password
  # Leave empty to auto-build from postgres settings above.
  databaseUrl: ""

images:
  dashboard:
    registry: public.ecr.aws
    repository: stackguard-io/dashboard
    digest: "sha256:85670abebc3bd7dc35d3ab375dfbf360cfc100f7b52a3003d3eda7859220cbf2"
    pullPolicy: IfNotPresent
  server:
    registry: public.ecr.aws
    repository: stackguard-io/server
    digest: "sha256:4620999ddf0225bbfdddb2cbc61c3c54031c8e81f708246b683574e245643f94"
    pullPolicy: IfNotPresent
  ai:
    registry: public.ecr.aws
    repository: stackguard-io/ai
    digest: "sha256:1193c2f16df1cad8190a88edf53aff7d385b50415641123993973c4ae019b437"
    pullPolicy: IfNotPresent
  postgres:
    registry: ""
    repository: postgres
    tag: "16.4"
    pullPolicy: IfNotPresent

dashboard:
  enabled: true
  replicas: 1
  service:
    type: LoadBalancer
    port: 4000
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

server:
  enabled: true
  replicas: 1
  service:
    type: LoadBalancer
    port: 8080
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    size: 10Gi

ai:
  enabled: true
  replicas: 1
  service:
    type: LoadBalancer
    port: 8000
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

postgres:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

networkPolicy:
  enabled: true

vpa:
  enabled: false
  updateMode: Off
