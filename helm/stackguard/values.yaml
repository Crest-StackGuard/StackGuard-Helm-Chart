# Default values for the Stackguard Helm chart (split server + dashboard).
#
# Bundled by default: server, dashboard, Postgres, Valkey (official valkey/valkey).
# For managed Postgres + managed Redis-compatible cache (e.g. Azure Cache for Redis),
# set postgres.enabled / valkey.enabled to false and supply secrets.databaseUrl + secrets.redisUrl.
#
# Monolithic: exactly ONE pod each for server, dashboard, postgres, and valkey.
# No HPA / VPA / horizontal pod autoscaling. Scale by raising CPU/RAM or node size only.
# Setting *.replicas to anything other than 1 fails the chart.
namespace: stackguard
createNamespace: true

nameOverride: ""
fullnameOverride: ""

global:
  storageClass: ""
  imagePullSecrets: []
  # AKS region (e.g. centralindia). With <component>.service.azureDnsLabel set,
  # empty urls below resolve to http://<label>.<region>.cloudapp.azure.com:<port>.
  azureRegion: ""

urls:
  # Empty -> Azure DNS name (see global.azureRegion), else http://localhost:<port>.
  dashboard: http://localhost:4000
  api: http://localhost:8080

secrets:
  stackguardSecret: "0123456789abcdef0123456789abcdef"
  postgres:
    database: stackguard
    user: stackguard
    password: replace-with-strong-password
  valkey:
    user: stackguard
    password: replace-with-strong-password
  # Managed / external overrides (used when postgres.enabled or valkey.enabled is false)
  databaseUrl: ""
  redisUrl: ""

# Every image needs a pinned tag (or digest); the chart refuses to guess one.
images:
  dashboard:
    registry: public.ecr.aws
    repository: stackguard-io/dashboard
    tag: v1.1.1
    pullPolicy: IfNotPresent
  server:
    registry: public.ecr.aws
    repository: stackguard-io/server
    tag: v1.1.1
    pullPolicy: IfNotPresent
  # Postgres 17. Upgrading from chart 0.1.x (Postgres 16.4)? Set tag "16.16" or
  # migrate first — see "Upgrading" in helm/README.md.
  postgres:
    registry: ""
    repository: postgres
    tag: "17.12"
    pullPolicy: IfNotPresent
  # Official Valkey image: https://hub.docker.com/r/valkey/valkey
  valkey:
    registry: ""
    repository: valkey/valkey
    tag: "8.1.12"
    pullPolicy: IfNotPresent

dashboard:
  enabled: true
  service:
    type: LoadBalancer
    port: 4000
    # AKS only: publishes <label>.<region>.cloudapp.azure.com for this LoadBalancer.
    azureDnsLabel: ""
  # Optional, e.g. stackguard.io/os: ubuntu (the label our Terraform sets on nodes).
  nodeSelector: {}
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi

server:
  enabled: true
  service:
    type: LoadBalancer
    port: 8080
    # AKS only: publishes <label>.<region>.cloudapp.azure.com for this LoadBalancer.
    azureDnsLabel: ""
  nodeSelector: {}
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi
    # Move data from the old single-folder layout (root mounted at /scans) into
    # scans/ on first start. Safe on new volumes; runs once per volume.
    migrateLegacyLayout: true

valkey:
  enabled: true
  service:
    type: ClusterIP
    port: 6379
  nodeSelector: {}
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    size: 2Gi

postgres:
  enabled: true
  service:
    type: ClusterIP
    port: 5432
  nodeSelector: {}
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 10Gi

networkPolicy:
  enabled: true
